[project]
name = "traffic"
version = "0.2.0"
description = "Microsimulation of vehicle flow on a road segment with traffic lights (CPU, in parallel) and a train journey simulation with route map and video"
readme = "README.md"
authors = [
    { name = "elaeon", email = "1216884+elaeon@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68",
    "numpy>=2.5.3",
]

[project.scripts]
traffic = "traffic.cli:main"
traffic-view = "traffic.cli:view_main"
traffic-variants = "traffic.cli:variants_main"
traffic-emissions = "traffic.cli:emissions_main"
traffic-calibrate = "traffic.cli:calibrate_main"
rail = "rail.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = ["traffic", "rail"]
