# Chepe (Ferrocarril Chihuahua al Pacífico): Los Mochis -> Chihuahua through the Copper Canyon.
#
# Curated, APPROXIMATE data for a simple visual simulation; not survey data.
# - km: distance from Los Mochis, derived from the official kilometre posts (counted from
#   Ojinaga) as km = 921 - official_km. Total ~653 km, 86 tunnels, 37 major bridges.
# - lat/lon: approximate location of each town or landmark (decimal degrees).
# - elevation_m: terrain elevation above sea level at the point on the real track, from SRTM
#   (smoothed with a 5 km running median; see elevation_chepe.csv).
# - max_speed_kmh: speed limit from this point until the next point that sets one
#   (inherited when omitted). Calibrated so Los Mochis -> Creel takes ~9 h 40 min,
#   the published Chepe Express time.
# - dwell_min: stop time at a station (stations only).
# - kind: "station" (the train stops), "landmark" (annotated, no stop) or
#   "waypoint" (only shapes the map line).
# - label_offset: optional [dx, dy] offset of the map label, in points.
# - highlight: true on the stations where the Chepe Express stops (drawn in a distinct colour;
#   stops listed on chepe.mx: Los Mochis, El Fuerte, Bahuichivo, Divisadero, Creel).

name = "Chepe: Los Mochis - Chihuahua"
ends = ["mochis", "chihuahua"]   # `rail --route mochis-chihuahua` (default) or `--route chihuahua-mochis`
highlight_label = "Chepe Express stop"
author = "Cream Crimson"   # credited in the video and route.png, next to the data sources

# Used only with `rail --realistic`: the real track geometry from OpenStreetMap (downloaded once
# into track_file, next to this file; (c) OpenStreetMap contributors, ODbL) and slow motion
# through the Copper Canyon. Route points are snapped onto the track and km becomes the real
# distance along it; elevations come from SRTM terrain data (downloaded once into elevation_file).
[realistic]
track_file = "track_chepe.csv"
osm_relation = 5977762   # "Chihuahua al Pacífico" (route=train, Ferromex)
slow_from = "Témoris"
slow_to = "Creel"
slow_factor = 3.0
elevation_file = "elevation_chepe.csv"   # terrain elevation along the track (SRTM via OpenTopoData)
elevation_dataset = "srtm90m"
elevation_step_km = 1.0

[train]
accel_ms2 = 0.3   # starting acceleration
brake_ms2 = 0.5   # service braking
dt_s = 1.0        # time step

[[point]]
name = "Los Mochis"
kind = "station"
highlight = true
km = 0
lat = 25.770
lon = -108.965
elevation_m = 16
max_speed_kmh = 70
note = "Los Mochis: Pacific terminus, on the Sinaloa coastal plain"
label_offset = [8, -10]

